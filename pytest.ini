[pytest]
# ---------------------------------------------------------------------------
# Playwright Automation Base - pytest 설정
# ---------------------------------------------------------------------------

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 기본 실행 옵션
#  - failure_demo 는 Evidence 검증용 의도적 실패 테스트라 기본 실행에서 제외한다.
#    실행하려면:  pytest -m failure_demo
#  - base_unit 은 Base 프레임워크 자체의 회귀 테스트다. 고객사용 리포트에 업무 테스트와
#    섞여 나오면 안 되므로 기본 실행에서 제외한다.
#    실행하려면:  pytest -m base_unit
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    -m "not failure_demo and not base_unit"

# pytest-playwright 기본값 (Evidence 는 Base 가 직접 관리하므로 모두 off)
#  --tracing/--screenshot/--video 를 켜면 pytest-playwright 가 test-results/ 에도 따로 남긴다.
#  Base 는 artifacts/<run_id>/ 아래에 TC 식별 가능한 이름으로 직접 저장한다.

log_cli = false
log_cli_level = INFO
log_cli_format = [%(asctime)s] [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# ---------------------------------------------------------------------------
# Marker
#   실행 유형 : smoke / regression / e2e / failure_demo
#   업무 영역 : login / payment / product / search / api  (Category 통계에 사용)
#   특성     : slow / flaky
#   메타     : tc_id / category / title
# ---------------------------------------------------------------------------
markers =
    smoke: 핵심 기능 최소 검증 (배포 직후 빠르게 확인)
    regression: 회귀 테스트 전체 집합
    e2e: 여러 화면에 걸친 업무 흐름 시나리오 (테스트 간 순서 의존 허용)
    failure_demo: Evidence/리포트 검증용 의도적 실패 테스트 (기본 실행 제외)
    base_unit: Base 자체 회귀 테스트 (브라우저 미사용, 기본 실행 제외)
    spec_pending: TC 명세서에 없는 테스트. 어떤 실행에서도 제외됩니다 (tests/conftest.py). 돌리려면 pytest -m spec_pending
    login: 업무 영역 - 로그인
    payment: 업무 영역 - 결제
    product: 업무 영역 - 상품
    search: 업무 영역 - 검색
    api: API 레벨 테스트 (Browser 미사용)
    slow: 수행 시간이 긴 테스트
    flaky: 불안정이 알려진 테스트 (재시도 대상)
    tc_id(id): 테스트 케이스 ID 지정. 예) @pytest.mark.tc_id("TC001")
    category(name): 리포트 Category 명시 지정. 예) @pytest.mark.category("Login")
    title(text): 리포트에 표시할 테스트 이름. 미지정 시 docstring 첫 줄 사용
    expected(text): TC 대표 기대결과. 명세서의 마지막 「기대결과」 칸을 그대로 옮깁니다 (리포트에 표시)

filterwarnings =
    ignore::DeprecationWarning
