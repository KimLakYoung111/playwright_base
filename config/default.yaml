# ---------------------------------------------------------------------------
# 모든 환경의 공통 기본값.
# config/<env>.yaml 이 이 파일을 덮어쓰고, .env(환경변수)가 그 위를 덮어쓰고,
# CLI 옵션(--env / --browser / --headed / --base-url)이 최우선입니다.
# ---------------------------------------------------------------------------

project_name: "Example Automation"

# 테스트 대상 앱의 버전. 자동화 코드의 버전과 다릅니다.
#  CI 에서 APP_VERSION 환경변수로 주는 것을 권장합니다.
#  비워두면 리포트에 표시하지 않습니다. 형식은 자유입니다.
app_version: ""

# 리포트 표시 옵션
report:
  # 실행자 이름을 result.json / 리포트에 남길지.
  # 개인정보가 걸리는 고객사면 false 로 두세요.
  show_triggered_by: true

  # 실행이 끝나면 report.html 을 기본 브라우저로 열지.
  #  CI 환경변수(CI / GITHUB_ACTIONS / JENKINS_URL 등)가 잡히거나 -n 병렬 실행이면
  #  이 값이 true 여도 열지 않습니다. 그때도 열려면 pytest --open-report.
  #  한 번만 끄려면 pytest --no-open-report.
  auto_open: true

browser: chromium          # chromium | firefox | webkit
headless: true
slow_mo: 0                 # ms. 디버깅 시 200~500 정도로 올려서 확인

timeouts:
  default: 30000           # page.set_default_timeout (ms)
  navigation: 45000        # page.set_default_navigation_timeout (ms)
  expect: 10000            # expect(...) 기본 대기 (ms)

viewport:
  width: 1920
  height: 1080

locale: ko-KR
timezone: Asia/Seoul
ignore_https_errors: false

# get_by_test_id() 가 찾을 속성.
# 사이트가 data-qa / data-test 등을 쓰면 여기만 바꾸면 테스트 코드는 그대로입니다.
# codegen 에도 같은 값을 넘기세요:  playwright codegen --test-id-attribute=data-qa <url>
test_id_attribute: data-testid

# 프로젝트마다 필요한 값을 자유롭게 추가하세요.
# 테스트에서는 run_config.get("features.new_checkout") 으로 꺼내 씁니다.
# 환경별로 다르면 config/<env>.yaml 에서 덮어쓰면 됩니다.
features:
  new_checkout: true

# Flaky 대응 재시도. 기본 0 (실제 오류를 숨기지 않기 위함)
# CI 에서만 올리려면:  pytest --reruns 1
retries: 0

# Evidence 저장 정책: always | on-failure | never
#  trace 를 on-failure 로 두면 실패 순간을 담기 위해 모든 테스트에서 수집을 시작하고
#  통과하면 버립니다. 통과 테스트당 약 0.1~0.2초가 더 듭니다.
#  실패 분석 가치가 훨씬 크므로 기본값으로 두고, 속도가 급하면 never 로 바꾸세요.
evidence:
  screenshot: on-failure
  trace: on-failure
  page_html: on-failure
  log: on-failure

# 오래된 artifacts/<실행시각>/ 폴더 정리.
#  실행을 시작할 때 보관 기간이 지난 폴더를 지웁니다.
#  0 으로 두면 정리하지 않습니다(CI 처럼 매번 새 머신이면 불필요).
artifacts:
  keep_days: 14
  # 기간이 지났어도 최근 N개는 남깁니다.
  # 오래 쉬었다가 돌렸을 때 직전 실행 기록까지 통째로 날아가는 것을 막는 안전장치입니다.
  keep_min_runs: 5

# 계정 정보.
#  - username 은 민감정보가 아니므로 yaml 에 둡니다.
#  - password 는 절대 yaml 에 쓰지 않고 password_env 로 .env 의 변수명을 가리킵니다.
accounts:
  user:
    username: "standard_user"
    password_env: USER_PASSWORD
  admin:
    username: "admin_user"
    password_env: ADMIN_PASSWORD
