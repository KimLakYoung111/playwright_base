# ---------------------------------------------------------------------------
# Playwright Automation Base - 버전 고정 파일 (lock)
#
# requirements.txt 는 "이 범위면 동작한다" 는 뜻이고,
# 이 파일은 "실제로 검증된 조합" 입니다. 딸려온 패키지까지 전부 고정합니다.
#
#   pip install -r requirements.lock       <- 검증된 조합 그대로 (CI / 팀 공유 권장)
#   pip install -r requirements.txt        <- 그 시점의 최신으로
#
# 검증 환경 : Windows 10 + Python 3.12.10 / 3.14.2
#             Linux (Debian, python:3.12-slim 컨테이너) + Python 3.12.12
#             세 조합 모두 전체 테스트 통과 확인
# 생성일    : 2026-09-06
# 갱신 방법 : 새 가상환경에 requirements.txt 로 설치 -> 테스트 전부 통과 확인 ->
#             pip freeze > requirements.lock
#
# 주의: Playwright 는 파이썬 패키지와 브라우저 엔진 버전이 짝을 이룹니다.
#       이 파일로 설치한 뒤에는 반드시 playwright install 을 다시 실행하세요.
#       playwright 1.62.0 기준 chromium 151 / firefox 153 / webkit 26.5
# ---------------------------------------------------------------------------

